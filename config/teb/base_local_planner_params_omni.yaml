TebLocalPlannerROS:
  odom_topic: odom
  map_frame: map

  # 与旧版保持一致的速度和加速度限制。
  acc_lim_x: 0.4
  acc_lim_y: 0.5
  acc_lim_theta: 1.8
  acc_lim_x_backwards: 0.5

  max_vel_x: 1.0
  max_vel_x_backwards: 1.0
  max_vel_y: 1.0
  max_vel_theta: 2.0

  min_turning_radius: 0.0
  is_footprint_dynamic: false
  footprint_model:
    type: "polygon"
    vertices: [[0.17, -0.13], [0.17, 0.13], [-0.17, 0.13], [-0.17, -0.13]]

  yaw_goal_tolerance: 0.1
  xy_goal_tolerance: 0.1
  free_goal_vel: false

  dt_ref: 0.25
  dt_hysteresis: 0.1
  min_samples: 3
  global_plan_overwrite_orientation: false
  global_plan_viapoint_sep: 0.10
  max_global_plan_lookahead_dist: 2.0
  force_reinit_new_goal_dist: 1.0
  feasibility_check_no_poses: 3
  publish_feedback: false
  allow_init_with_backwards_motion: true
  exact_arc_length: false
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 10.0

  min_obstacle_dist: 0.05
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.5
  # 0.13 m + 0.12 m = 0.25 m，与旧线模型软膨胀包络一致。
  inflation_dist: 0.12
  include_dynamic_obstacles: false
  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 0.5
  obstacle_association_cutoff_factor: 5.0
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5.0

  no_inner_iterations: 3
  no_outer_iterations: 3
  optimization_active: true
  optimization_verbose: false
  penalty_epsilon: 0.05

  weight_acc_lim_x: 3.0
  weight_acc_lim_y: 3.0
  weight_acc_lim_theta: 3.0
  weight_max_vel_x: 3.5
  weight_max_vel_y: 3.0
  weight_max_vel_theta: 2.5

  weight_kinematics_nh: 1.0
  weight_kinematics_forward_drive: 10.0
  weight_kinematics_turning_radius: 1000.0
  weight_optimaltime: 25
  weight_obstacle: 55.0
  weight_viapoint: 50.0
  weight_inflation: 0.05
  weight_adapt_factor: 2.0

  enable_homotopy_class_planning: false
  enable_multithreading: false
  max_number_classes: 3
  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 88.0
  selection_viapoint_cost_scale: 1.0
  selection_alternative_time_cost: false
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5.0
  h_signature_prescaler: 1.0
  h_signature_threshold: 0.1
  obstacle_heading_threshold: 0.45
  visualize_hc_graph: false
  viapoints_all_candidates: true
  switching_blocking_period: 0.0
  wheelbase: 0.2

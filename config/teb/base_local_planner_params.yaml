TebLocalPlannerROS: # Time Elastic Band 拥有多个优化目标：整体路径长度、轨迹运行时间、与障碍物的距离、通过中间路径点以及机器人动力学、运动学以及几何约束的符合性
  odom_topic: odom
  map_frame: map

  #加速度同样约束减速过程
  acc_lim_x: 0.6 #x轴方向加速度约束
  acc_lim_y: 0.6 #y轴方向加速度约束
  acc_lim_theta: 2.0 #角加速度约束 避免车轮打滑，车辆失控
  acc_lim_x_backwards: 0.5 #最大倒车加速度

  max_vel_x: 1.2 #x轴方向速度约束
  max_vel_y: 1.2 #y轴方向速度约束
  max_vel_theta: 2.0 #角速度约束 应作用在车辆高速行驶 防止高重心转弯过快翻车
  max_vel_x_backwards: 1.0 #最大倒车速度

  min_turning_radius: 0.0 #最小转弯半径（麦轮设为0）
  is_footprint_dynamic: false
  footprint_model:
    type: "polygon" #多边形表示复杂模型 由定点的列表组成
    vertices: [[0.17, -0.13], [0.17, 0.13], [-0.17, 0.13], [-0.17, -0.13]] 

  #目标跟踪误差
  yaw_goal_tolerance: 0.1
  xy_goal_tolerance: 0.1
  free_goal_vel: false #自由目标速度 设为False时 车辆到达终点时的目标速度为0

  dt_ref: 0.25 #局部路径规划的解析度
  dt_hysteresis: 0.1 #允许改变的时域解析度的浮动范围
  #dt_ref和dt_hysteresis是最优路径上的两个相邻姿态的默认距离 较小的值理论上可以提供更高的精度 速度越大，相邻距离越大 
  min_samples: 3 #轨迹中的最小样本数
  global_plan_overwrite_orientation: false #2d规划置fasle 对全局路径更好追踪
  global_plan_viapoint_sep: 0.10 #从全局路径提取路径点的间隔距离
  max_global_plan_lookahead_dist: 2.5 #该参数决定局部规划初始轨迹的最大长度 过长也可能导致优化结果无法有效收敛
  force_reinit_new_goal_dist: 1.0  #强制重新初始化规划器的新目标距离阈值
  feasibility_check_no_poses: 3 #在判断生成的轨迹是否冲突时使用，此时设置为3，即从轨迹起点开始逐个检查轨迹上的3个点，若3个点均不发生碰撞，则认为本次轨迹有效
  publish_feedback: false
  allow_init_with_backwards_motion: false #是否允许第一个动作就是倒车
  exact_arc_length: false
  shrink_horizon_backup: true #临时缩小规划视野 防死锁
  shrink_horizon_min_duration: 10.0

  min_obstacle_dist: 0.07 #最小障碍物距离
  #增大min_obstacle_dist可以防止机器人离墙太近，但是对于狭窄通道的情况，反而应该设置的很小。 可以增大机器人轮廓，但减小min_obs_dist，提高防撞性，又保证过窄通道
  include_costmap_obstacles: true #设置为True后规避实时探测到的、建图时不存在的障碍物
  costmap_obstacles_behind_robot_dist: 1.0 #限制在机器人后面规划时考虑到的占用的本地成本图障碍
  inflation_dist: 0.12 #障碍物膨胀距离。这个值必须大于min_obstacle_dist才有效 此膨胀只是降低通过这些区域的优先级，不应当用此距离迫使车辆远离障碍物
  include_dynamic_obstacles: false
  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 0.5 #强制纳入近距离障碍物的范围系数，越小只关注更近障碍
  obstacle_association_cutoff_factor: 5.0 
  costmap_converter_plugin: "" #是否使用costmap_converter插件  若设置为空字符，则视为禁用转换 插件的作用是将障碍物预先表示成线段或多边形的形式，可以在一定程度上减轻后续计算距离的压力
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5.0

  no_inner_iterations: 3 #被外循环调用后内循环执行优化次数
  no_outer_iterations: 3 #执行的外循环的优化次数
  optimization_active: true #激活优化
  optimization_verbose: false #打印优化过程详情
  penalty_epsilon: 0.05 #对于硬约束近似，在惩罚函数中添加安全范围

  weight_acc_lim_x: 5.0 #最大x加速度权重
  weight_acc_lim_y: 5.0 #最大y加速度权重
  weight_acc_lim_theta: 6.0 #最大角加速度权重
  weight_max_vel_x: 4.0 #最大x速度权重
  weight_max_vel_y: 2.0 #最大y速度权重
  weight_max_vel_theta: 4.0 #最大角速度权重

  weight_kinematics_nh: 0.4 #满足非完整运动学的优化权值 应设置较小值 完整约束机器人无需限制其运动学约束
  weight_kinematics_forward_drive: 1000.0 #优化过程中，迫使机器人只选择前进方向
  weight_kinematics_turning_radius: 0.0 #优化过程中，车型机器人的最小转弯半径的权重
  weight_optimaltime: 25 #优化过程中，基于轨迹的时间上的权重 越大越能接近max_vel_x 并靠近路径边缘沿切线过弯
  weight_obstacle: 60.0 #优化过程中，和障碍物最小距离的权重
  weight_viapoint: 45.0 # 路径跟随权重，越大越贴合全局路径/路径点，过大可能降低自主绕障空间
  weight_inflation: 0.05 # 膨胀区代价权重，越大越远离膨胀区，过小容易贴边
  weight_adapt_factor: 2.0 # 每次外层迭代中部分权重的自适应放大因子

  enable_homotopy_class_planning: false # 不启用多拓扑路径搜索 
  enable_multithreading: false
  max_number_classes: 2
  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 88.0
  selection_viapoint_cost_scale: 1.0
  selection_alternative_time_cost: false
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5.0
  h_signature_prescaler: 1.0
  h_signature_threshold: 0.1
  obstacle_heading_threshold: 0.45
  visualize_hc_graph: false
  viapoints_all_candidates: true
  switching_blocking_period: 0.0
  wheelbase: 0.2 # 轴距参数，主要用于类车模型；全向/差速模型影响较小
